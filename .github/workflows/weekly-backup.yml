name: Private encrypted PostgreSQL backup
on:
  workflow_dispatch:
  # Enable only after owner approval and artifact quota review:
  # schedule:
  #   - cron: '0 2 * * 0' # Sunday 07:00 Asia/Tashkent
permissions:
  contents: read
concurrency:
  group: izlanish-database-writer
  cancel-in-progress: false
jobs:
  backup:
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install uv==0.12.19
          uv sync --frozen --no-dev
      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          BACKUP_MAX_BYTES: '20971520'
          BACKUP_MAX_SECONDS: '180'
        run: |
          test -n "$BACKUP_ENCRYPTION_PASSPHRASE"
          backup=$(.venv/bin/python scripts/backup_postgres.py --docker-client)
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 --output "$backup.gpg" "$backup"
          rm -- "$backup"
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-postgres-backup
          path: data/backups/*.gpg
          retention-days: 1
          if-no-files-found: error
      - name: Remove runner dump files
        if: always()
        run: rm -f data/backups/*.dump data/backups/*.gpg
