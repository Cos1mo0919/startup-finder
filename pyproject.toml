[project]
name = "uzbekistan-startup-finder"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.12,<5",
  "feedparser>=6.0,<7",
  "protego>=0.4,<1",
  "apscheduler>=3.11,<4",
  "python-dateutil>=2.9,<3",
  "psycopg[binary]>=3.2,<4",
  "telethon>=1.40,<2",
]
[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
