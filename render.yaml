services:
  - type: web
    name: izlanish
    runtime: docker
    branch: render-deploy
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: SCHEDULER_ENABLED
        value: "false"
      - key: DATABASE_AUTO_MIGRATE
        value: "false"
      - key: STARTUP_DATA_UPDATES_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        value: "[]"
